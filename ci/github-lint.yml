name: shell-lint
# Optional. Only useful if your project contains shell scripts. trailair itself
# installs this template (dogfooding) so the shipped scripts stay lint-clean.
# If your project has no shell of its own, you can drop this workflow.
on: [pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh hooks/pre-commit
