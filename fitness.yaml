# fitness.yaml — what "better" means in THIS project.
# This copy is agentloop's OWN (the framework repo is self-bootstrapped).
# When installed into another project, skills/bootstrap.md rewrites this file.
#
# CONSTRAINT: `run:` values must be single-line commands (quoted). YAML block
# scalars (run: | ...) are NOT supported — scripts/eval.sh will reject them.
# Wrap anything longer in a script under scripts/ and call that.
version: 1

# Gates: must ALWAYS pass. The keep-or-revert boundary.
gates:
  - name: selftest
    run: "bash scripts/selftest.sh"   # proves every enforcement mechanism can fail

# Metrics: optimized by the improve loop. Direction: lower | higher.
# Metrics must be CHEAP and must not re-run the gates.
metrics:
  - name: skills_doc_lines        # framework self-metric: smaller playbooks win
    run: "cat skills/*.md | wc -l"
    direction: lower

# Budgets for the improve loop.
budget:
  minutes_per_run: 15
  max_mutations_per_run: 5
