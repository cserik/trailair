name: shell-lint
# Framework-repo-only workflow (not shipped to host projects): the framework's
# executable surface is shell, so lint it. shellcheck is preinstalled on runners.
on: [pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh hooks/pre-commit hooks/install.sh
